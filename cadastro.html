<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Multi Idle Arena</title><link rel="stylesheet" href="styles.css"></head><body><div class="bg"></div><div class="authwrap"><form class="authcard" id="form"><div class="authbrand"><img src="arena-logo.png"><div><strong>MULTI IDLE ARENA</strong><div class="muted">Criar sua conta</div></div></div><h1>Crie sua conta</h1><p>Use o mesmo login no site e no launcher. O Trial é validado no primeiro acesso pelo aplicativo.</p><div class="field"><label>Nome</label><input id="name" required autocomplete="name"></div><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn primary" style="width:100%" type="submit">Criar conta</button><div id="msg" class="msg"></div><p style="text-align:center">Já tem conta? <a href="login.html" style="color:#ff6c80">Entrar</a></p></form></div><script type="module" src="cadastro.js"></script></body></html>
